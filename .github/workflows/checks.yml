name: Checks

# OpenClaw Cat Paw ships installers and one container image — there is no npm
# package here, so there is no TypeScript matrix (that lives in
# cat-paw-latch). These jobs are exactly this repo's surface:
#
#   shell       bash -n plus shellcheck over scripts/*.sh and image/*.sh
#   powershell  parse every scripts/*.ps1 with the PowerShell parser
#   docker      validate compose.yml, then build the image install.sh runs
#
# main is protected and requires all three.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse with bash -n
        run: |
          for f in scripts/*.sh image/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck scripts/*.sh image/*.sh

  powershell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Parses every script without running it — the PowerShell twin of
      # `bash -n`. pwsh ships on the ubuntu runner; nothing is installed.
      - name: Parse every .ps1
        shell: pwsh
        run: |
          $files = Get-ChildItem scripts -Filter *.ps1 -Recurse -File
          $failed = $false
          foreach ($file in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in @($errors)) {
              $rel = $file.FullName.Substring((Get-Location).Path.Length + 1)
              Write-Host "::error file=$rel,line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "$($files.Count) PowerShell scripts parsed."

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify local adapted skill packs
        run: python3 scripts/verify-local-skills.py
      - name: Validate compose.yml
        run: docker compose -f compose.yml config -q
      # Proves the deliverable assembles: base image pull, the review CLIs
      # (gitleaks, gh, jq, yq, shellcheck only), the skill overlay and the
      # persona. No credentials and no push — publishing stays manual.
      - name: Build the image
        run: docker build --tag openclaw-cat-paw:ci .
      - name: Confirm baked review CLIs
        run: docker run --rm --entrypoint /opt/cat-paw/verify-review-tools.sh openclaw-cat-paw:ci
      # The overlay is the product. A build that assembles while /opt/plow/skills
      # is empty still ships a cat with no playbooks, and one that bakes the
      # repository layout as-is ships the ten routers with none of the thirty
      # playbooks behind them, because OpenClaw stops at a directory that has a
      # SKILL.md. So: every SKILL.md in the repo must be a top-level skill here.
      #
      # INSIDE the container, and that is the whole point. /opt/plow/skills
      # exists in the image, not on the runner, so a check that stats it from
      # the host finds nothing and fails on a perfectly good build. The repo is
      # mounted read-only; only the paths under /opt are read.
      - name: Confirm the skill overlay landed and was flattened
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo:ro" --entrypoint bash openclaw-cat-paw:ci -c '
            set -euo pipefail
            expected=0
            while IFS= read -r skill_md; do
              name=$(basename "$(dirname "$skill_md")")
              expected=$((expected + 1))
              if [ ! -f "/opt/plow/skills/$name/SKILL.md" ]; then
                echo "::error::$name is not a top-level skill in the image"
                exit 1
              fi
            done < <(find /repo/skills -name SKILL.md -type f)
            if [ "$expected" -eq 0 ]; then
              echo "::error::the repository mount came up empty; this proves nothing"
              exit 1
            fi
            nested=$(find /opt/plow/skills -mindepth 3 -name SKILL.md -type f | wc -l)
            if [ "$nested" -ne 0 ]; then
              echo "::error::$nested playbooks are still nested"
              exit 1
            fi
            test -f /opt/plow/prompt/AGENTS.md || { echo "::error::persona missing"; exit 1; }
            echo "$expected playbooks are top-level skills, and the persona is present."
          '
      # A trailing `USER root` in the Dockerfile silently ships the deployment
      # privileged, and nothing else in this job would notice. Assert the user.
      - name: Confirm the image does not run as root
        run: |
          set -euo pipefail
          got=$(docker image inspect openclaw-cat-paw:ci --format '{{.Config.User}}')
          if [ "$got" = "root" ] || [ -z "$got" ]; then
            echo "::error::image runs as '$got'; the final USER must be node"
            exit 1
          fi
          docker run --rm --entrypoint id openclaw-cat-paw:ci -un
